name: "Автоматическая сборка и релиз DferTune"




on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'DferTune/**'
      - 'common/**'
      - 'ipc/**'
      - 'overlay/**'
      - 'scripts/verify-localizations.mjs'
      - 'scripts/verify-issue-38.mjs'
      - '.github/workflows/build-and-release.yml'




permissions:
  contents: write




jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.CHANGED }}
      new_version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          fetch-depth: 0




      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"




      - name: Проверка согласованности локализаций
        run: node scripts/verify-localizations.mjs




      - name: Проверка реализации issue №38
        run: node scripts/verify-issue-38.mjs




      - name: Извлечение текущей версии из Makefile
        id: version
        run: |
          VERSION=$(grep "export VERSION" Makefile | sed 's/.*:= *//' | xargs)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"




      - name: Проверка изменения версии
        id: check
        run: |
          CURRENT_VERSION='${{ steps.version.outputs.VERSION }}'
          if git rev-parse --verify --quiet "refs/tags/v$CURRENT_VERSION" >/dev/null; then
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          fi




  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Установка зависимостей (jq)
        run: apt-get update && apt-get install -y jq curl git




      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          fetch-depth: 0




      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"




      - name: Проверка языковых файлов
        run: |
          if [ -d "overlay/lang" ]; then
            echo "Языковые файлы найдены."
          else
            echo "Ошибка: Директория overlay/lang не найдена!"
            exit 1
          fi




      - name: Подготовка библиотек
        run: make prepare-overlay-lib




      - name: Сборка проекта
        run: make clean && make -j$(nproc)




      - name: Проверка целостности сборки
        run: |
          if [ -f "DferTune/DferTune.nsp" ] && [ -f "overlay/DferTune-Overlay.ovl" ]; then
            echo "Сборка успешно завершена."
          else
            echo "Ошибка: Файлы сборки не найдены!"
            ls -R
            exit 1
          fi

      - name: Подготовка архива DferTune.zip
        run: |
          mkdir -p release/atmosphere/contents/420000000000000F/flags
          mkdir -p release/config/DferTune
          mkdir -p release/switch/.overlays

          # 1. Атмосфера (модуль)
          touch release/atmosphere/contents/420000000000000F/flags/boot2.flag
          cp DferTune/DferTune.nsp release/atmosphere/contents/420000000000000F/exefs.nsp
          cp DferTune/toolbox.json release/atmosphere/contents/420000000000000F/

          # 2. Конфиги и языки
          if [ -d "overlay/lang" ]; then
            cp -r overlay/lang release/config/DferTune/
          fi
          cp .github/default-config.ini release/config/DferTune/config.ini

          # 3. Оверлей
          cp overlay/DferTune-Overlay.ovl release/switch/.overlays/

          # Упаковка
          cd release && zip -r ../DferTune.zip . && cd ..

      - name: Формирование текста релиза
        id: changelog
        run: |
          git fetch --tags
          CURRENT_VERSION='${{ needs.check-version.outputs.new_version }}'
          LATEST_TAG=$(git tag -l | grep -E "^v[0-9]" | sort -V | grep -v "^v$CURRENT_VERSION$" | tail -n 2 | head -n 1 || echo "")
          
          if [[ -n "$LATEST_TAG" ]]; then
            RANGE="${LATEST_TAG}..HEAD"
            DIFF_RANGE="$RANGE"
          else
            RANGE="HEAD"
            DIFF_RANGE="$(git hash-object -t tree /dev/null)..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"- %h %s" -n 40 || true)
          FILE_STATS=$(git diff --shortstat "$DIFF_RANGE" || true)
          CHANGED_FILES=$(git diff --name-only "$DIFF_RANGE" | sed -n '1,30s/^/- /p' || true)
          RAW_LOG=$(git log "$RANGE" --no-merges --pretty=format:"%s" | grep -Evi "^merge|update workflow|fix yaml" | head -n 50)

          [[ -z "$COMMITS" ]] && COMMITS="- Нет значимых коммитов в данном диапазоне."
          [[ -z "$FILE_STATS" ]] && FILE_STATS="Изменений в файлах не зафиксировано."
          [[ -z "$CHANGED_FILES" ]] && CHANGED_FILES="- Список файлов пуст."

          if [[ -n "$RAW_LOG" ]]; then
            CHANGELOG_SECTIONS=$(echo "$RAW_LOG" | awk '
              BEGIN{new="";impr="";fix=""}
              {l=tolower($0)}
              l ~ /(add|feature|нов|support|lang|созд)/ {new=new "- " $0 "\n"; next}
              l ~ /(fix|bug|crash|error|исправ|почин|ошиб)/ {fix=fix "- " $0 "\n"; next}
              {impr=impr "- " $0 "\n"}
              END{
                if(new!="") printf "### Новое\n%s\n", new;
                if(impr!="") printf "### Улучшения\n%s\n", impr;
                if(fix!="") printf "### Исправления\n%s\n", fix;
              }')
          else
            CHANGELOG_SECTIONS="- Внутренние технические изменения."
          fi

          {
            echo "RELEASE_BODY<<EOF"
            echo "## Список изменений"
            echo ""
            echo "$CHANGELOG_SECTIONS"
            echo ""
            echo "### Технические детали"
            echo "- Версия: $CURRENT_VERSION"
            echo "- Диапазон: \`$RANGE\`"
            echo "- Статистика: $FILE_STATS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Подготовка итогового описания релиза
        run: |
          NOTES_FILE=".github/releases/v${{ needs.check-version.outputs.new_version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cp "$NOTES_FILE" .release-body.md
          else
            {
              printf '%s\n' "$RELEASE_BODY"
              echo
              echo '---'
              echo '_Описание подготовлено по фактическим изменениям релиза._'
            } > .release-body.md
          fi

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: DferTune v${{ needs.check-version.outputs.new_version }}
          files: |
            DferTune.zip
            overlay/DferTune-Overlay.ovl
          body_path: .release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-release-notes:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Проверка подготовленного описания
        id: notes
        run: |
          NOTES_FILE=".github/releases/v${{ needs.check-version.outputs.new_version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Обновление описания существующего релиза
        if: steps.notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          body_path: .github/releases/v${{ needs.check-version.outputs.new_version }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
