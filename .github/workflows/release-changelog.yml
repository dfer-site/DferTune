name: Release Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-changelog-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-release:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft }}
    steps:
      - name: 安装 jq
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Git 安全目录
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 生成发布说明(AI,失败时使用结构化备用方案)
        id: changelog
        run: |
          CURRENT_TAG='${{ github.event.release.tag_name }}'
          NOTES_FILE=".github/releases/${CURRENT_TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              cat "$NOTES_FILE"
              echo "EOF"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          RANGE="${CURRENT_TAG}"
          [[ -n "$PREV_TAG" ]] && RANGE="${PREV_TAG}..${CURRENT_TAG}"
          
          RAW_LOG=$(git log "$RANGE" --no-merges --pretty=format:"%s" | grep -Evi "^merge|update workflow|fix yaml" | head -n 40)

          if [[ -n "${OPENROUTER_API_KEY}" && -n "$RAW_LOG" ]]; then
            PROMPT="你是 DferTune 项目的发布负责人。请用简体中文以 markdown 格式撰写发布说明。
            格式与规则:
            1) 简短的开头(1-2 句)。
            2) 按顺序列出以下章节(只写相关的):
               - ## 新增
               - ## 改进
               - ## 修复
               - ## 兼容性与迁移
            3) 只写对用户有意义的改动。
            4) 不要照抄提交信息,按含义归纳。
            5) 不要提及 AI 或自动生成。
            6) 篇幅:200-400 字。

            原始提交信息(仅作参考):
            $RAW_LOG"
            
            PAYLOAD=$(jq -n \
              --arg model "openrouter/auto" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: "只用简体中文,结构清晰,直截了当。"},
                  {role: "user", content: $prompt}
                ],
                temperature: 0.5
              }')

            RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          fi

          if [[ -n "$RAW_LOG" ]]; then
            CHANGELOG_SECTIONS=$(echo "$RAW_LOG" | awk '
              BEGIN{new="";impr="";fix=""}
              {l=tolower($0)}
              l ~ /(add|feature|support|lang|新增|新功能|支持|添加)/ {new=new "- " $0 "\n"; next}
              l ~ /(fix|bug|crash|error|修复|崩溃|错误)/ {fix=fix "- " $0 "\n"; next}
              {impr=impr "- " $0 "\n"}
              END{
                if(new!="") printf "## 新增\n%s\n", new;
                if(impr!="") printf "## 改进\n%s\n", impr;
                if(fix!="") printf "## 修复\n%s\n", fix;
              }')
          else
            CHANGELOG_SECTIONS="- 此标签中没有发现对用户有意义的改动。"
          fi

          if [[ -n "${AI_BODY}" && "${AI_BODY}" != "null" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              echo "$AI_BODY"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "RELEASE_BODY<<EOF"
              echo "👋 你好!DferTune 有新版本了。"
              echo
              echo "$CHANGELOG_SECTIONS"
              echo
              echo "## 技术细节"
              echo "- 本次发布由 CI 自动构建并打包。"
              echo "- 说明根据此次发布范围内的实际代码改动整理。"
              echo
              echo "感谢使用 DferTune! 🎧"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: 更新发布说明
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _本说明根据此次发布的实际改动生成。_
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
