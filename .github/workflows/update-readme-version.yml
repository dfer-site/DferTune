name: Update README Version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version without the v prefix. Leave empty to use the latest release.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-readme-version-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.draft }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve released version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="${REQUESTED_VERSION#v}"
          elif [[ "$EVENT_NAME" == "release" && -n "$RELEASE_TAG" ]]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name')
            VERSION="${VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update the README version marker
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'README.md';
          const readme = fs.readFileSync(path, 'utf8');
          const marker = /<!-- CURRENT_VERSION_START -->[^<\r\n]*<!-- CURRENT_VERSION_END -->/g;
          const matches = readme.match(marker) ?? [];

          if (matches.length !== 1) {
            throw new Error(`Expected exactly one README version marker, found ${matches.length}.`);
          }

          const next = `<!-- CURRENT_VERSION_START -->${process.env.VERSION}<!-- CURRENT_VERSION_END -->`;
          fs.writeFileSync(path, readme.replace(marker, next));
          NODE

      - name: Verify README automation contract
        run: node scripts/verify-readme-automation.mjs

      - name: Commit and push only when needed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config --local user.name "dfer-site"
          git config --local user.email "www.dfer.site@gmail.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README.md already contains v${VERSION}."
            exit 0
          fi

          git commit -m "docs: sync README version to v${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
