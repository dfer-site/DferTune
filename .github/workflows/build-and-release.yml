name: "DferTune 自动构建与发布"




on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'DferTune/**'
      - 'common/**'
      - 'ipc/**'
      - 'overlay/**'
      - 'scripts/verify-localizations.mjs'
      - 'scripts/verify-issue-38.mjs'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 是否创建标签并发布 release(默认只构建并上传构建产物)
        required: false
        type: boolean
        default: false




permissions:
  contents: write




jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.CHANGED }}
      new_version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0




      - name: 配置 Git 安全目录
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"




      - name: 检查本地化文件一致性
        run: node scripts/verify-localizations.mjs




      - name: 检查 issue #38 的实现
        run: node scripts/verify-issue-38.mjs




      - name: 从 Makefile 读取当前版本
        id: version
        run: |
          VERSION=$(grep "export VERSION" Makefile | sed 's/.*:= *//' | xargs)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"




      - name: 检查版本是否变化
        id: check
        run: |
          CURRENT_VERSION='${{ steps.version.outputs.VERSION }}'
          if git rev-parse --verify --quiet "refs/tags/v$CURRENT_VERSION" >/dev/null; then
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          fi




  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: 安装依赖 (jq)
        run: apt-get update && apt-get install -y jq curl git




      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0




      - name: 配置 Git 安全目录
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"




      - name: 检查语言文件
        run: |
          if [ -d "overlay/lang" ]; then
            echo "已找到语言文件。"
          else
            echo "错误:未找到 overlay/lang 目录!"
            exit 1
          fi




      - name: 准备依赖库
        run: make prepare-overlay-lib




      - name: 构建项目
        run: make clean && make -j$(nproc)




      - name: 检查构建产物
        run: |
          if [ -f "DferTune/DferTune.nsp" ] && [ -f "overlay/DferTune-Overlay.ovl" ]; then
            echo "构建成功。"
          else
            echo "错误:未找到构建产物!"
            ls -R
            exit 1
          fi

      - name: 打包 DferTune.zip
        run: |
          mkdir -p release/atmosphere/contents/420000000000000F/flags
          mkdir -p release/config/DferTune
          mkdir -p release/switch/.overlays

          # 1. Atmosphere 模块
          touch release/atmosphere/contents/420000000000000F/flags/boot2.flag
          cp DferTune/DferTune.nsp release/atmosphere/contents/420000000000000F/exefs.nsp
          cp DferTune/toolbox.json release/atmosphere/contents/420000000000000F/

          # 2. 配置与语言文件
          if [ -d "overlay/lang" ]; then
            cp -r overlay/lang release/config/DferTune/
          fi
          cp .github/default-config.ini release/config/DferTune/config.ini

          # 3. 悬浮菜单
          cp overlay/DferTune-Overlay.ovl release/switch/.overlays/

          # 打包
          cd release && zip -r ../DferTune.zip . && cd ..

      - name: 生成发布说明
        id: changelog
        run: |
          git fetch --tags
          CURRENT_VERSION='${{ needs.check-version.outputs.new_version }}'
          LATEST_TAG=$(git tag -l | grep -E "^v[0-9]" | sort -V | grep -v "^v$CURRENT_VERSION$" | tail -n 2 | head -n 1 || echo "")
          
          if [[ -n "$LATEST_TAG" ]]; then
            RANGE="${LATEST_TAG}..HEAD"
            DIFF_RANGE="$RANGE"
          else
            RANGE="HEAD"
            DIFF_RANGE="$(git hash-object -t tree /dev/null)..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"- %h %s" -n 40 || true)
          FILE_STATS=$(git diff --shortstat "$DIFF_RANGE" || true)
          CHANGED_FILES=$(git diff --name-only "$DIFF_RANGE" | sed -n '1,30s/^/- /p' || true)
          RAW_LOG=$(git log "$RANGE" --no-merges --pretty=format:"%s" | grep -Evi "^merge|update workflow|fix yaml" | head -n 50)

          [[ -z "$COMMITS" ]] && COMMITS="- 此范围内没有重要提交。"
          [[ -z "$FILE_STATS" ]] && FILE_STATS="未检测到文件改动。"
          [[ -z "$CHANGED_FILES" ]] && CHANGED_FILES="- 文件列表为空。"

          if [[ -n "$RAW_LOG" ]]; then
            CHANGELOG_SECTIONS=$(echo "$RAW_LOG" | awk '
              BEGIN{new="";impr="";fix=""}
              {l=tolower($0)}
              l ~ /(add|feature|support|lang|新增|新功能|支持|添加)/ {new=new "- " $0 "\n"; next}
              l ~ /(fix|bug|crash|error|修复|崩溃|错误)/ {fix=fix "- " $0 "\n"; next}
              {impr=impr "- " $0 "\n"}
              END{
                if(new!="") printf "### 新增\n%s\n", new;
                if(impr!="") printf "### 改进\n%s\n", impr;
                if(fix!="") printf "### 修复\n%s\n", fix;
              }')
          else
            CHANGELOG_SECTIONS="- 内部技术性改动。"
          fi

          {
            echo "RELEASE_BODY<<EOF"
            echo "## 更新内容"
            echo ""
            echo "$CHANGELOG_SECTIONS"
            echo ""
            echo "### 技术细节"
            echo "- 版本:$CURRENT_VERSION"
            echo "- 范围:\`$RANGE\`"
            echo "- 统计:$FILE_STATS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 准备最终发布说明
        run: |
          NOTES_FILE=".github/releases/v${{ needs.check-version.outputs.new_version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cp "$NOTES_FILE" .release-body.md
          else
            {
              printf '%s\n' "$RELEASE_BODY"
              echo
              echo '---'
              echo '_本说明根据此次发布的实际改动生成。_'
            } > .release-body.md
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DferTune-${{ needs.check-version.outputs.new_version }}
          path: |
            DferTune.zip
            overlay/DferTune-Overlay.ovl

      - name: 创建标签并发布
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: DferTune v${{ needs.check-version.outputs.new_version }}
          files: |
            DferTune.zip
            overlay/DferTune-Overlay.ovl
          body_path: .release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-release-notes:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 检查预先准备的发布说明
        id: notes
        run: |
          NOTES_FILE=".github/releases/v${{ needs.check-version.outputs.new_version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新已有发布的说明
        if: steps.notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          body_path: .github/releases/v${{ needs.check-version.outputs.new_version }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
